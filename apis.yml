description: >-
  The United States National Library of Medicine (NLM) is the world's largest biomedical library. It serves as a vital
  resource for researchers, healthcare professionals, and the general public by providing access to a vast collection of
  biomedical literature and resources. The NLM offers a wide range of services and resources including online databases,
  digital archives, and research tools that support medical research, education, and patient care. Key APIs include the
  NCBI E-Utilities (PubMed, Entrez), NCBI Datasets (genomes, genes), BLAST sequence alignment, and the
  ClinicalTrials.gov API.
